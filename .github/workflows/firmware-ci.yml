# Firmware CI for domecontrol_JK3.ino
#
# 1. host-logic-tests: compiles the firmware unchanged against the Arduino mocks in
#    test/host/mock and runs the scenario suite for BOTH site profiles (Germany =
#    mirrored wiring, Portugal = standard wiring). The dome physics in the test
#    decides what "physically closed" means, independently of the firmware. Each site
#    runs twice: with the ToF layer compiled out (the default) and built in.
# 2. arduino-build: real avr-gcc build for the MEGA 2560 with the same libraries the
#    Arduino IDE uses, for every site profile (-DSITE=1 / 2) with and without the ToF
#    layer (-DENABLE_TOF_FROZEN_DETECTION=0 / 1). Any compiler warning inside the
#    sketch fails the job.
name: Firmware CI

on:
  push:
    paths:
      - 'domecontrol_JK3.ino'
      - 'test/host/**'
      - '.github/workflows/firmware-ci.yml'
  pull_request:
    paths:
      - 'domecontrol_JK3.ino'
      - 'test/host/**'
      - '.github/workflows/firmware-ci.yml'
  workflow_dispatch:

jobs:
  host-logic-tests:
    name: Logic tests (host simulation, both sites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run scenario suite
        run: make -C test/host test

  arduino-build:
    name: Arduino build (MEGA 2560, SITE=${{ matrix.site }}, TOF=${{ matrix.tof }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [1, 2]
        tof: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8   # same core the Arduino IDE on the Mac uses
          arduino-cli lib install "Ethernet@2.0.2" "OneWire" "DallasTemperature" "VL53L0X"
      - name: Compile sketch
        run: |
          mkdir -p build/domecontrol_JK3
          cp domecontrol_JK3.ino build/domecontrol_JK3/
          arduino-cli compile --fqbn arduino:avr:mega:cpu=atmega2560 --warnings all \
            --build-property "build.extra_flags=-DSITE=${{ matrix.site }} -DENABLE_TOF_FROZEN_DETECTION=${{ matrix.tof }}" \
            build/domecontrol_JK3 2>&1 | tee build.log
          # the sketch itself must be warning-free (library warnings are not ours)
          if grep -E 'domecontrol_JK3\.ino.*warning:' build.log; then
            echo "::error::compiler warnings in domecontrol_JK3.ino"; exit 1; fi
      - name: Report size
        run: grep -E 'Sketch uses|Global variables' build.log
